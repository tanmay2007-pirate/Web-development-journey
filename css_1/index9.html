<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video 24 (Shadows and outline )</title>

    <style>

        .box{
            border :2px solid black;
            padding :34px;
            box-shadow:10px 5px 20px gray 
        }

        .text-element{
            margin :50px;
            padding :34px;
            border:10px solid aqua;
            text-shadow: 10px 5px 10px purple; 
            
            outline: 20px solid red;

            border-radius : 20px;
            outline-offset:19px;
        }




    </style>
</head>
<body>

    <div class = "box">I am a Box</div>


    <div class ="text-element">
        Aliqua laboris enim ad proident excepteur sit proident. Occaecat anim occaecat esse ex. Deserunt exercitation ullamco minim nulla anim commodo elit qui. Eiusmod non ad ut anim Lorem do incididunt veniam elit nostrud. Aute do ullamco anim duis Lorem culpa eiusmod duis nostrud.
    </div>


    
</body>
</html>
