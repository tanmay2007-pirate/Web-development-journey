<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>video 28</title>

    <style>
      * {
        margin: 0px;
        padding: 0px;
      }

      .parent{
        padding : 43px;
        margin : 34px;
        border : 3px solid purple;
        /* position :absolute; */
        /* transform : translate(0); */
        /* filter : invert(0); */
        perspective : 0em;
        } 


      .box1{
        position :absolute;
        top : 2px;
        left: 144px;
        background-color :aqua;
      }
      .box2{
        top: -60px;
        left: 133px;
        position:relative;
        background-color :gray;
        
      }
      .box3{
        background-color :red;
        position :fixed;
        left : 25vw;
      }
      .box4{
        background-color :orange;
      }

      .box {
        border: 2px solid black;
        height :50px;
        width : 80vw;
        margin : 3px;
        padding : 3px;

      }
    </style>
  </head>

  <body>

    <div class = "parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
  </body>
