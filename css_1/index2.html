    <style>
        
        *{

        .box{

        }

        .box1{

        }

        .box2{
            color :blue;
            padding :10px;
            margin : 25px;
            border :2px solid black;
            height :200px;
            box-sizing: border-box;
        }

        /* margin collapse do boxes me ks bada wala sirf ek margin aayega. */


    </style>

    <div class ="box box1" > I am a box</div>
